[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-fleet-optimizer"
version = "0.1.0"
description = "End-to-end demand forecasting and fleet repositioning optimization platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Gregory Ryan Seaton"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
app = [
  "streamlit>=1.32",
  "plotly>=5.20",
]
data = [
  "pyarrow>=15",
  "polars>=0.20",
  "duckdb>=1.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "geopandas>=1.0",
]
or = [
  "gurobipy>=11.0",
]
tracking = [
  "mlflow>=2.10",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
